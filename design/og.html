<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:J;font-weight:800;src:url(fonts/PlusJakartaSans_800ExtraBold.ttf)}@font-face{font-family:J;font-weight:600;src:url(fonts/PlusJakartaSans_600SemiBold.ttf)}
*{box-sizing:border-box;margin:0}html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:J,sans-serif;color:#fff;position:relative;background:radial-gradient(900px 600px at 15% 20%,#0B2A6B,transparent 65%),radial-gradient(700px 600px at 95% 100%,rgba(110,60,230,.55),transparent 60%),radial-gradient(600px 500px at 70% 10%,rgba(10,122,255,.45),transparent 60%),#04091B}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 40% 30%,#000,transparent 75%)}
.brand{position:absolute;left:80px;top:68px;display:flex;align-items:center;gap:16px;font-weight:800;font-size:40px;letter-spacing:-1.5px}.brand img{width:52px;height:54px}
h1{position:absolute;left:80px;top:178px;font-size:112px;line-height:.95;letter-spacing:-5.5px;font-weight:800}
h1 em{font-style:normal;background:linear-gradient(100deg,#fff 5%,#9FE0FF 45%,#5CC8FF 85%);-webkit-background-clip:text;color:transparent}
.soon{position:absolute;left:80px;top:470px;display:inline-flex;align-items:center;gap:12px;padding:14px 28px;border-radius:999px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.22);font-weight:600;font-size:27px}
.soon i{width:12px;height:12px;border-radius:50%;background:#6BFFB0;box-shadow:0 0 14px #6BFFB0}
.halo{position:absolute;right:120px;top:60px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(46,155,255,.6),transparent 68%);filter:blur(20px)}
.ph{position:absolute;width:300px;border-radius:50px;padding:9px;background:linear-gradient(150deg,#2a3558,#05070f);box-shadow:0 0 0 1.5px rgba(255,255,255,.2) inset,0 40px 80px -16px rgba(0,8,40,.9),0 0 60px rgba(46,155,255,.3)}
.ph img{width:100%;border-radius:41px;display:block}
.a{right:300px;top:110px;transform:rotate(-7deg)}.b{right:46px;top:170px;transform:rotate(6deg)}
</style>
<div class="grid"></div><div class="halo"></div>
<div class="brand"><img src="../public/logo.png">Lifty</div>
<h1>Train like<br>it <em>matters.</em></h1>
<div class="soon"><i></i>Coming soon to iOS and Android</div>
<div class="ph a"><img src="../public/screens/workout.webp"></div><div class="ph b"><img src="../public/screens/today.webp"></div>
